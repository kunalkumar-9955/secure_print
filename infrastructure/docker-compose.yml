version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: secureprint_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secureprint_production_db_password
      POSTGRES_DB: secureprint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secureprint_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    container_name: secureprint_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:secureprint_production_db_password@postgres:5432/secureprint?schema=public
      REDIS_URL: redis://redis:6379
      API_BASE_URL: https://api.secureprint.example
      PUBLIC_BASE_URL: https://secureprint.example
      JWT_SECRET: super-secure-production-jwt-secret-key-32chars
      TZ: Asia/Kolkata
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    container_name: secureprint_web
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
